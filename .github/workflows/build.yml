name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # Build the Velocity proxy plugin jar
  # ============================================================
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # -U forces refresh of the velocity-api 4.1.0-SNAPSHOT dependency
      # so a stale cached snapshot never masks upstream API changes.
      - name: Build
        run: mvn -B -U clean package --no-transfer-progress

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: velocityglobalchat
          path: target/velocityglobalchat-*.jar
          if-no-files-found: error

  # ============================================================
  # Create a GitHub Release and attach the jar (tags only)
  # ============================================================
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: velocityglobalchat
          path: jars/

      # Extract the changelog section for this tag from CHANGELOG.md
      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.0
          VERSION="${TAG#v}"                # strip leading v → 1.2.0

          # Pull out everything between this version's ## heading and the next one
          NOTES=$(awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md \
                  | head -n -1 \
                  | tail -n +2)

          # GitHub Actions multiline output
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VelocityGlobalChat ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          files: jars/*.jar
